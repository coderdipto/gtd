[package]
name = "gtd-capture"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Capture-only desktop client for the GTD app"
authors = ["Sudipto Das"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for `"transparent": true` to actually take effect
# on macOS. Without it the window still paints an opaque white NSWindow
# background and the frameless card sits on a white rectangle. Pairs with
# `app.macOSPrivateApi` in tauri.conf.json — both are needed, neither alone
# does anything. (Rules the app out of the Mac App Store; irrelevant here,
# it's built and installed locally.)
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls rather than native-tls: keeps the Windows/macOS builds from needing a
# platform OpenSSL, which is the usual cross-compile failure for this crate.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync"] }
chrono = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
