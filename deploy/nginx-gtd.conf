server {
    listen 80;
    server_name gtd.sudipto.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gtd.sudipto.dev;

    # certbot --nginx manages these two lines and the http->https redirect above.
    ssl_certificate     /etc/letsencrypt/live/gtd.sudipto.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gtd.sudipto.dev/privkey.pem;

    client_max_body_size 25M; # a bit over the 20MB attachment cap (core/notes.py)

    location /static/ {
        alias /home/gtd/app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Private attachment serving (Note attachments, docs/task-breakdown.md Epic 12):
    # `internal` means this location is unreachable by a direct client request -
    # only Django's own X-Accel-Redirect response header (core/notes.py::note_attachment_serve)
    # can route a request here, after it's already checked login + ownership.
    location /protected-media/ {
        internal;
        alias /home/gtd/app/media/;
    }

    location / {
        proxy_pass http://unix:/run/gtd/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
