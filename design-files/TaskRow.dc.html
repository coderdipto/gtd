<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="--w-radius:6px;--w-body:'Lato','Inter',system-ui,sans-serif;--w-mono:'JetBrains Mono',ui-monospace,monospace">
  <sc-if value="{{ visible }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:flex-start;gap:12px;padding:11px 14px;background:var(--w-surface);border-bottom:1px solid var(--w-line);border-left:{{ leftBorder }};transition:background .12s ease" style-hover="background:var(--w-inset)">

      <button type="button" onClick="{{ toggle }}" title="Complete" style="flex:none;margin-top:1px;width:20px;height:20px;border-radius:50%;border:2px solid {{ circleBorder }};background:{{ circleFill }};cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0" style-hover="border-color:var(--w-accent)">
        <span style="color:#fff;font:700 11px var(--w-body);opacity:{{ checkOpacity }}">✓</span>
      </button>

      <div onClick="{{ openRow }}" style="flex:1;min-width:0;cursor:{{ rowCursor }}">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <sc-if value="{{ isProject }}" hint-placeholder-val="{{ false }}">
            <span style="flex:none;color:var(--w-soft);font-size:14px">🗀</span>
          </sc-if>
          <sc-if value="{{ marker }}" hint-placeholder-val="{{ false }}">
            <span title="{{ markerTitle }}" style="flex:none;width:11px;height:11px;border-radius:50%;border:2px solid var(--w-accent);background:{{ markerFill }}"></span>
          </sc-if>
          <span style="font:500 14px/1.35 var(--w-body);color:{{ titleColor }};text-decoration:{{ strike }}">{{ task.title }}</span>

          <sc-for list="{{ badges }}" as="b" hint-placeholder-count="0">
            <span style="{{ b.style }}">{{ b.text }}</span>
          </sc-for>
        </div>

        <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ false }}">
          <div style="font:400 12px/1.4 var(--w-body);color:var(--w-soft);margin-top:3px;display:flex;align-items:center;gap:6px">
            <span style="flex:none;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--w-accent)"></span>{{ task.nextLine }}
          </div>
        </sc-if>

        <sc-if value="{{ hasChips }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
            <sc-for list="{{ chips }}" as="c" hint-placeholder-count="0">
              <span style="{{ c.style }}">{{ c.text }}</span>
            </sc-for>
          </div>
        </sc-if>
      </div>

      <sc-if value="{{ task.meta }}" hint-placeholder-val="{{ false }}">
        <span style="flex:none;font:500 11.5px/1.6 var(--w-mono);color:{{ metaColor }};white-space:nowrap">{{ task.meta }}</span>
      </sc-if>

      <sc-for list="{{ actions }}" as="a" hint-placeholder-count="0">
        <button type="button" onClick="{{ a.run }}" style="{{ a.style }}">{{ a.label }}</button>
      </sc-for>

      <sc-if value="{{ showMenu }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ openRow }}" style="flex:none;width:24px;height:24px;border:none;background:transparent;color:var(--w-soft);cursor:pointer;border-radius:4px;font-size:15px;line-height:1" style-hover="background:var(--w-inset);color:var(--w-ink)">⋮</button>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:72},&quot;task&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  state = { done: false };

  renderVals() {
    const t = this.props.task || {};
    const controlled = typeof t.onComplete === 'function';
    const done = controlled ? !!t.done : (this.state.done || !!t.done);
    const isProject = t.kind === 'project';

    const pill = (bg, fg, extra) =>
      `display:inline-flex;align-items:center;gap:3px;font:600 10.5px/1 var(--w-mono);padding:3px 7px;border-radius:999px;background:${bg};color:${fg};white-space:nowrap;${extra || ''}`;

    const badges = (t.badges || []).map((tok) => {
      const [k, n] = String(tok).split(':');
      switch (k) {
        case 'carried': return { text: `↩ ×${n}`, style: pill('var(--w-amber-bg)', 'var(--w-amber)') };
        case 'missed': return { text: `⚠ ×${n}`, style: pill('var(--w-red-bg)', 'var(--w-red)') };
        case 'overdue': return { text: n ? `overdue ${n}` : 'overdue', style: pill('var(--w-red-bg)', 'var(--w-red)') };
        case 'waiting': return { text: `waiting ${n}d`, style: pill(Number(n) >= 5 ? 'var(--w-amber-bg)' : 'var(--w-inset)', Number(n) >= 5 ? 'var(--w-amber)' : 'var(--w-soft)') };
        case 'star': return { text: '★', style: `font-size:13px;color:var(--w-star)` };
        case 'q2': return { text: 'Q2', style: pill('var(--w-violet-bg)', 'var(--w-violet)') };
        case 'stalled': return { text: 'stalled?', style: pill('var(--w-amber-bg)', 'var(--w-amber)') };
        case 'nonext': return { text: 'no next →', style: pill('transparent', 'var(--w-amber)', 'border:1px solid var(--w-amber)') };
        case 'progress': return { text: n, style: pill('var(--w-inset)', 'var(--w-soft)') };
        default: return { text: tok, style: pill('var(--w-inset)', 'var(--w-soft)') };
      }
    });

    const chips = [
      ...(t.contexts || []).map((c) => ({ text: c, style: `font:500 11px var(--w-mono);color:var(--w-accent);background:var(--w-accent-soft);border-radius:999px;padding:3px 9px` })),
      ...(t.tags || []).map((c) => ({ text: c, style: `font:500 11px var(--w-mono);color:var(--w-soft);background:var(--w-inset);border-radius:999px;padding:3px 9px` })),
    ];

    const overdueMeta = (t.badges || []).some((b) => String(b).startsWith('overdue')) || t.metaAlert;

    const actions = (t.actions || []).map((a) => ({
      label: a.label, run: a.run,
      style: `flex:none;height:28px;padding:0 11px;border:1px solid ${a.danger ? 'var(--w-red)' : 'var(--w-accent)'};border-radius:var(--w-radius);background:transparent;color:${a.danger ? 'var(--w-red)' : 'var(--w-accent)'};font:600 12px var(--w-body);cursor:pointer;white-space:nowrap`,
    }));

    return {
      task: t,
      visible: controlled ? true : !done,
      isProject,
      badges,
      chips,
      hasChips: chips.length > 0,
      hasSub: isProject && !!t.nextLine,
      marker: t.marker === 'flag' || t.marker === 'implicit',
      markerFill: t.marker === 'flag' ? 'var(--w-accent)' : 'transparent',
      markerTitle: t.marker === 'flag' ? 'Flagged next action' : 'Implicit next action (first incomplete)',
      leftBorder: t.q2 ? '2px solid var(--w-violet)' : '2px solid transparent',
      circleFill: done ? 'var(--w-accent)' : 'transparent',
      circleBorder: done ? 'var(--w-accent)' : 'var(--w-line)',
      checkOpacity: done ? 1 : 0,
      strike: done ? 'line-through' : 'none',
      titleColor: done ? 'var(--w-soft)' : 'var(--w-ink)',
      metaColor: overdueMeta ? 'var(--w-red)' : 'var(--w-soft)',
      rowCursor: t.onOpen ? 'pointer' : 'default',
      openRow: t.onOpen || (() => {}),
      actions,
      showMenu: (t.actions || []).length === 0 && !t.hideMenu,
      toggle: () => { if (controlled) t.onComplete(); else this.setState({ done: true }); },
    };
  }
}
</script>
</body>
</html>
