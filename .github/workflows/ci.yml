name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gtd
          POSTGRES_PASSWORD: gtd
          POSTGRES_DB: gtd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gtd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # DEBUG=True keeps WhiteNoise's hashed-manifest static storage off, so the
      # template-rendering tests resolve {% static %} without a collected
      # manifest — the same way the suite runs locally.
      DEBUG: "True"
      SECRET_KEY: "ci-only-not-secret"
      DATABASE_URL: "postgres://gtd:gtd@localhost:5432/gtd"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # This project splits requirements under requirements/*.txt, so tell
          # the pip cache what to hash (it otherwise looks only for a top-level
          # requirements.txt / pyproject.toml and errors out).
          cache-dependency-path: requirements/*.txt

      # Install prod deps too so the boto3-dependent backup test can run.
      - name: Install dependencies
        run: pip install -r requirements/dev.txt -r requirements/prod.txt

      - name: System check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test core -v1
